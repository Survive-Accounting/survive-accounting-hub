# Deploy the render worker (worker/) to Fly from GitHub — no flyctl on any laptop.
#
# 2026-09-14: the deployed worker predated dissect_stitch (punch-in's pause-trimming join), and flyctl is
# blocked on the filming PC by Windows Application Control. Run this from the Actions tab
# ("Deploy render worker" → Run workflow). Needs the repository secret FLY_API_TOKEN: a deploy token for
# the sa-render-worker app, created in the Fly dashboard.
name: Deploy render worker

on:
  workflow_dispatch:

concurrency: deploy-render-worker

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        working-directory: worker
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
