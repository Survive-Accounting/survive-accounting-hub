# Fly.io config for the render worker. Deploy: `cd worker && fly deploy`.
#
# IDLE STRATEGY — "exit when idle", NOT proxy auto-stop. Fly's proxy stops a
# machine whenever its instantaneous connection load is 0 at a check pass (it
# cannot see a background ffmpeg), so brief 4-5s status polls do NOT protect a
# running render. Instead: auto_stop is OFF (the proxy never kills the machine)
# and the worker process EXITS ITSELF after 5 idle minutes with no active jobs
# (server.ts). Clean exit + restart policy "on-failure" ⇒ the machine stops
# (≈ $0 idle) and auto_start boots it again on the next request.
app = "sa-render-worker"
primary_region = "ord"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 0

[[restart]]
  policy = "on-failure"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "2gb"
