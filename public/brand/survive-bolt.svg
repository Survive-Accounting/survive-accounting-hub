<svg xmlns="http://www.w3.org/2000/svg" viewBox="-18.21 -2.26 109.27 146.96" width="219" height="294" role="img" aria-label="Survive — the bolt">
  <title>Survive — the bolt</title>
  <desc>The mark as the site draws it today: one silhouette in the lit colour with a white keyline, and the seam region filled in the shade colour on top. Two closed paths, solid fills, no gradients. Colours are CSS variables with the brand values as fallbacks — set --sa-lit and --sa-shade to recolour it for a campus.</desc>
